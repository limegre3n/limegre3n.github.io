name: Build HEIF to JPEG APK

on:
  push:
    paths:
      - "heif-to-jpeg-android/**"
      - ".github/workflows/heif-to-jpeg-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: heif-to-jpeg-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk HeifToJpeg.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HeifToJpeg-apk
          path: heif-to-jpeg-android/HeifToJpeg.apk

      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: heif-to-jpeg-build-${{ github.run_number }}
          name: HEIF to JPEG converter (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            Android APK for converting HEIF/HEIC/HIF (incl. 10-bit 4:2:2) to quality-100 4:4:4 JPEG.
            Download HeifToJpeg.apk on your phone and open it to install (allow "install unknown apps").
          files: heif-to-jpeg-android/HeifToJpeg.apk
